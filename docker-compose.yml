# Entorno de desarrollo completo de Hotel Nube:
#   cp .env.example .env   (y rellena las contraseñas)
#   docker compose up --build
#
#   Web:     http://localhost:8000
#   API:     http://localhost:8001
#   Correos: http://localhost:8025 (Mailpit captura todos los correos)
name: hotel-nube

services:
  db:
    image: mariadb:11.4.13
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en el .env}
      DB_PASSWORD_ADMIN: ${DB_PASSWORD_ADMIN:?Define DB_PASSWORD_ADMIN en el .env}
      DB_PASSWORD_CONEXION: ${DB_PASSWORD_CONEXION:?Define DB_PASSWORD_CONEXION en el .env}
      DB_PASSWORD_ESTANDAR: ${DB_PASSWORD_ESTANDAR:?Define DB_PASSWORD_ESTANDAR en el .env}
    volumes:
      - db-datos:/var/lib/mysql
      # Solo se ejecutan la primera vez, con el volumen vacío
      - ./config/db_hotel.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
      - ./docker/db/02-usuarios.sh:/docker-entrypoint-initdb.d/02-usuarios.sh:ro
      - ./config/db_usuarios.sql:/hotel/db_usuarios.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build: https://github.com/danielperez9430/hotelnube-api.git#master
    environment:
      SITE_URL: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:8000
    ports:
      - "127.0.0.1:8001:8001"

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8025:8025"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    env_file: .env
    # Sustituyen a los valores del .env para usar los otros contenedores
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: hotel
      DB_USER_ADMIN: hotel_admin
      DB_USER_CONEXION: hotel_conexion
      DB_USER_ESTANDAR: hotel_estandar
      # Usuario con permisos de esquema, solo para scripts/migrar.php
      DB_USER_MIGRACIONES: root
      DB_PASSWORD_MIGRACIONES: ${DB_ROOT_PASSWORD}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_ENCRYPTION: ""
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      SITE_URL: http://localhost:8000
      API_URL: http://localhost:8001
      API_INTERNAL_URL: http://api:8001
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      mailpit:
        condition: service_started

volumes:
  db-datos:
