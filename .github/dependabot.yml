# Actualizaciones automáticas de dependencias: solo versiones menores y
# parches, agrupadas en un PR por ecosistema. Las versiones mayores pueden
# romper la compatibilidad, así que se actualizan a mano
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      menores:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Solo ESLint (herramienta de desarrollo)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    commit-message:
      prefix: "chore(deps-dev)"
    groups:
      eslint:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    commit-message:
      prefix: "ci(deps)"
    groups:
      acciones:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Imágenes del Dockerfile de la web (php y composer). PHP solo recibe
  # parches (8.5.x): una versión menor trae deprecaciones y Dependabot
  # llega a proponer versiones candidatas como 8.6.0RC2
  - package-ecosystem: docker
    directory: /docker/web
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      - dependency-name: php
        update-types: [version-update:semver-minor]

  # Imágenes de docker-compose.yml y docker-compose.prod.yml (MariaDB y
  # Mailpit). MariaDB solo recibe parches: incluso una versión menor puede
  # exigir migrar los datos
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      - dependency-name: mariadb
        update-types: [version-update:semver-minor]
