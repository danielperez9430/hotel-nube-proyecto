name: Imagen Docker

# Publica la imagen de la web en GitHub Container Registry (ghcr.io):
#   - cada push a master        -> :master y :sha-<commit>
#   - cada etiqueta vX.Y.Z      -> :X.Y.Z, :X.Y y :latest
# La CI ya construye y comprueba la imagen en los pull requests
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEN: ghcr.io/${{ github.repository_owner }}/hotel-nube-web

jobs:
  imagen:
    name: Construir y publicar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=hotel-nube-web
            org.opencontainers.image.description=Web de reservas de Hotel Nube (PHP + Apache)

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
